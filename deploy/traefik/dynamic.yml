# Cloudflare Origin Certificate(SSL/TLS > Origin Server 에서 발급, *.도메인·도메인 포함)를
# deploy/certs/origin.pem, origin.key 로 둔다. Cloudflare SSL 모드는 Full (strict).
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/origin.pem
        keyFile: /certs/origin.key
  options:
    default:
      minVersion: VersionTLS12
